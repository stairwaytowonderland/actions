name: Get Authorization Token
description: 'Reusable action to get an authorization token either from a GitHub App or a user (or personal) access token.'

inputs:
  paths:
    description: 'The paths to check for changes. If any of these paths have changed, the action will output a list of changed files.'
    # default: |
    #   package.json
    #   package-lock.json
  ignore-authors:
    description: 'A newline delimited list of commit authors to ignore when checking for changes (e.g. semantic-release-bot and github-actions[bot]).'
    # default: |
    #   github-actions[bot]
    #   semantic-release-bot
  ignore-events:
    description: 'A newline delimited list of GitHub event names to ignore when checking for changes (e.g. push, pull_request, workflow_dispatch).'
outputs:
  changed-files:
    description: 'A newline delimited list of changed files.'
    value: ${{ steps.changed-files.outputs.changed-files }}
  changed-files-filtered:
    description: 'A newline delimited list of changed files that match the specified paths and are not authored by ignored authors.'
    value: ${{ steps.intersect-files.outputs.intersected-files }}
  trigger-update:
    description: 'Whether to trigger an update based on the changed files and ignored authors.'
    value: ${{ steps.has-paths.outputs.trigger-update == 'true' && steps.has-authors.outputs.trigger-update == 'true' }}

runs:
  using: 'composite'
  steps:
    - name: Check event
      id: check-event
      shell: bash
      run: |
        if [ -z "$IGNORE_EVENTS" ]; then
          echo "is-ignore-event=false" >> $GITHUB_OUTPUT
        elif echo "$IGNORE_EVENTS" | grep -qE "^${GITHUB_EVENT_NAME}$"; then
          echo "is-ignore-event=true" >> $GITHUB_OUTPUT
        else
          echo "is-ignore-event=false" >> $GITHUB_OUTPUT
        fi
      env:
        IGNORE_EVENTS: ${{ inputs.ignore-events }}

    - name: Get changed files
      id: changed-files
      if: steps.check-event.outputs.is-ignore-event != 'true'
      shell: bash
      run: |
        FILES=()

        # Check if REF_BEFORE is a Null SHA (all zeros)
        if [ "$REF_BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$REF_BEFORE" ]; then
          echo "::warning::New branch or tag push detected. Falling back to parent commit diff."
          # Diff the current commit against its parent commit
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || git show --name-only --pretty="" HEAD)
        else
          CHANGED_FILES=$(git diff --name-only $REF_BEFORE $REF_AFTER)
        fi

        if [ -n "$CHANGED_FILES" ]; then
          echo "::info::Changed files: $CHANGED_FILES"
          for file in $CHANGED_FILES; do
            FILES+=("$file")
          done
          echo "changed-files=${FILES[*]}" >> $GITHUB_OUTPUT
        else
          echo "::notice::No changed files detected."
        fi
      env:
        REF_BEFORE: ${{ github.event.before }}
        REF_AFTER: ${{ github.event.after }}

    - name: Get specified paths
      id: specified-paths
      if: steps.check-event.outputs.is-ignore-event != 'true' && steps.specified-paths.outputs.paths != ''
      shell: bash
      run: |
        FILES=()
        if [ -n "$SPECIFIED_PATHS" ]; then
          echo "::info::Paths to check: $SPECIFIED_PATHS"
          # echo "paths=$SPECIFIED_PATHS" >> $GITHUB_OUTPUT
          for path in $SPECIFIED_PATHS; do
            FILES+=("$path")
          done
          echo "paths=${FILES[*]}" >> $GITHUB_OUTPUT
        else
          echo "::info::No paths specified to check."
        fi
      env:
        SPECIFIED_PATHS: ${{ inputs.paths }}

    - name: Determine if workflow should run based on changed paths
      id: has-paths
      if: steps.check-event.outputs.is-ignore-event != 'true' && steps.changed-files.outputs.changed-files != ''
      shell: bash
      run: |
        FILES=()
        SHOULD_RUN=false
        echo "::group::Checking commits for changes to specified paths"

        for file in $CHANGED_FILES; do
          for path in $SPECIFIED_PATHS; do
            if [ "$file" = "$path" ]; then
              echo "::info::Found change to path: $path"
              FILES+=("$path")
              SHOULD_RUN=true
            fi
          done
        done

        if [ "$SHOULD_RUN" != 'true' ]; then
          echo "::info::No changes found for specified paths."
        fi
        echo "::info::Should run based on changed paths: $SHOULD_RUN"
        echo "::info::Filtered files: ${FILES[*]}"
        echo "::endgroup::"
        echo "trigger-update=${SHOULD_RUN}" >> $GITHUB_OUTPUT
        echo "filtered-files=${FILES[*]}" >> $GITHUB_OUTPUT
      env:
        SPECIFIED_PATHS: ${{ steps.specified-paths.outputs.paths }}
        CHANGED_FILES: ${{ steps.changed-files.outputs.changed-files }}

    - name: Determine if workflow should run based on commit authors
      id: has-authors
      if: steps.check-event.outputs.is-ignore-event != 'true'
      shell: bash
      run: |
        AUTHORS=()
        SHOULD_RUN=true
        if [ -z "$IGNORE_AUTHORS" ]; then
          echo "::info::No authors specified to ignore, skipping author check."
          echo "trigger-update=${SHOULD_RUN}" >> $GITHUB_OUTPUT
          exit 0
        fi
        echo "::group::Checking commits for ignored authors"

        # Get the commit author name safely
        COMMIT_AUTHOR=$(git log -1 --pretty=format:'%an')
        echo "Commit author: $COMMIT_AUTHOR"
        echo "Authors to ignore: $IGNORE_AUTHORS"

        for author in $IGNORE_AUTHORS; do
          echo "Checking if '$COMMIT_AUTHOR' matches ignored author: '$author'"
          if [ "$author" = "$COMMIT_AUTHOR" ]; then
            echo "::info::Latest commit authored by ignored author: $author"
            SHOULD_RUN=false
            break
          else
            # Keep track of authors that did not cause a skip
            AUTHORS+=("$author")
          fi
        done

        if [ "$SHOULD_RUN" = 'true' ]; then
          echo "::info::No ignored authors found in latest commit."
        fi
        echo "::info::Should run based on authors: $SHOULD_RUN"
        echo "::info::Filtered authors: ${AUTHORS[*]}"
        echo "::endgroup::"
        echo "trigger-update=${SHOULD_RUN}" >> $GITHUB_OUTPUT
        echo "filtered-authors=${AUTHORS[*]}" >> $GITHUB_OUTPUT
      env:
        IGNORE_AUTHORS: ${{ inputs.ignore-authors }}

    - name: Intersect filtered files from paths and authors
      id: intersect-files
      if: steps.check-event.outputs.is-ignore-event != 'true' && steps.has-paths.outputs.filtered-files != '' && steps.has-authors.outputs.filtered-authors != ''
      shell: bash
      env:
        PATHS_FILES: ${{ steps.has-paths.outputs.filtered-files }}
        AUTHORS_FILES: ${{ steps.has-authors.outputs.filtered-authors }}
      run: |
        # If AUTHORS_FILES is empty, it means an ignored author was hit in the prior step
        INTERSECTED_FILES=()
        for file in $PATHS_FILES; do
          #if [[ " ${AUTHORS_FILES[*]} " == *" $file "* ]]; then
            INTERSECTED_FILES+=("$file")
          #fi
        done

        echo "::info::Intersected files: ${INTERSECTED_FILES[*]}"
        echo "intersected-files=${INTERSECTED_FILES[*]}" >> $GITHUB_OUTPUT
