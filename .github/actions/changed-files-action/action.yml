name: Get Authorization Token
description: 'Reusable action to get an authorization token either from a GitHub App or a user (or personal) access token.'

inputs:
  paths:
    description: 'The paths to check for changes. If any of these paths have changed, the action will output a list of changed files.'
    # default: |
    #   package.json
    #   package-lock.json
  ignore-authors:
    description: 'A newline delimited list of commit authors to ignore when checking for changes (e.g. semantic-release-bot and github-actions[bot]).'
    # default: |
    #   github-actions[bot]
    #   semantic-release-bot
  ignore-events:
    description: 'A newline delimited list of GitHub event names to ignore when checking for changes (e.g. push, pull_request, workflow_dispatch).'
outputs:
  changed-files:
    description: 'A newline delimited list of changed files.'
    value: ${{ steps.changed-files.outputs.changed-files }}
  changed-files-filtered:
    description: 'A newline delimited list of changed files that match the specified paths and are not authored by ignored authors.'
    value: ${{ steps.intersect-files.outputs.intersected-files }}
  trigger-update:
    description: 'Whether to trigger an update based on the changed files and ignored authors.'
    value: ${{ steps.has-paths.outputs.trigger-update == 'true' && steps.has-authors.outputs.trigger-update == 'true' }}

runs:
  using: 'composite'
  steps:
    - name: Initialize matching dependencies
      shell: bash
      run: npm install minimatch@10.0.1 --no-save --no-audit --no-fund --quiet

    - name: Process Workflow Logic
      id: process-workflow
      uses: actions/github-script@v9
      env:
        SPECIFIED_PATHS: ${{ inputs.paths }}
        IGNORE_AUTHORS: ${{ inputs.ignore-authors }}
        IGNORE_EVENTS: ${{ inputs.ignore-events }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      with:
        script: |
          const { Minimatch } = require('minimatch');
          const execSync = require('child_process').execSync;

          let changedFilesList = [];
          let filteredFilesList = [];
          let triggerUpdate = false;

          // 1. Evaluate Ignore Events Condition
          const currentEvent = context.eventName;
          const ignoreEvents = (process.env.IGNORE_EVENTS || '').split(/[\(\r\\)n\s,]+/).filter(Boolean);
          if (ignoreEvents.includes(currentEvent)) {
            core.info(`Event '${currentEvent}' matches ignore configuration. Skipping processing.`);
            core.setOutput('changed_files', '');
            core.setOutput('changed_files_filtered', '');
            core.setOutput('trigger_update', 'false');
            return;
          }

          // 2. Determine Changed Files Safely
          try {
            let diffOutput = '';
            const isTag = process.env.GITHUB_REF && process.env.GITHUB_REF.startsWith('refs/tags/');
            const refBefore = context.payload.before;
            const nullSha = '0000000000000000000000000000000000000000';

            if (isTag) {
              core.info('Tag push event identified. Parsing target commit structural changes.');
              diffOutput = execSync('git diff-tree --no-commit-id --name-only -r HEAD', { encoding: 'utf8' });
            } else if (!refBefore || refBefore === nullSha) {
              core.info('New branch tree push identified. Dynamically evaluating fork boundary points.');
              let defaultBranch = process.env.DEFAULT_BRANCH || 'main';
              let baseCommit = 'HEAD~1';
              try {
                baseCommit = execSync(`git merge-base origin/${defaultBranch} HEAD`, { encoding: 'utf8' }).trim();
              } catch (e) {
                core.info('Unable to calculate base branch intersection. Defaulting safely to parent check.');
              }
              diffOutput = execSync(`git diff --name-only ${baseCommit} HEAD`, { encoding: 'utf8' });
            } else {
              diffOutput = execSync(`git diff --name-only ${refBefore} ${context.payload.after}`, { encoding: 'utf8' });
            }

            changedFilesList = diffOutput.split('\n').map(f => f.trim()).filter(Boolean);
            core.info(`Detected Changed Files: ${changedFilesList.join(', ')}`);
          } catch (error) {
            core.info(`Git processing execution completed with empty frames: ${error.message}`);
          }

          // 3. Process Glob Path Matches
          const inputPaths = (process.env.SPECIFIED_PATHS || '').split(/[\(\r\\)n,]+/).map(p => p.trim()).filter(Boolean);
          if (inputPaths.length > 0 && changedFilesList.length > 0) {
            const matchers = inputPaths.map(pattern => new Minimatch(pattern, { dot: true, matchBase: false }));

            filteredFilesList = changedFilesList.filter(file => {
              return matchers.some(matcher => matcher.match(file));
            });
            core.info(`Files Matching Path Patterns: ${filteredFilesList.join(', ')}`);
          } else {
            core.info('No explicit path patterns provided or changed file list is empty.');
          }

          // 4. Validate Commit Author Authority
          let authorIsAllowed = true;
          const ignoreAuthors = (process.env.IGNORE_AUTHORS || '').split(/[\(\r\\)n,]+/).map(a => a.trim()).filter(Boolean);

          if (ignoreAuthors.length > 0) {
            try {
              const commitAuthor = execSync("git log -1 --pretty=format:'%an'", { encoding: 'utf8' }).trim();
              core.info(`Commit authored by: '${commitAuthor}'`);
              if (ignoreAuthors.includes(commitAuthor)) {
                core.info(`Commit author '${commitAuthor}' matches ignore criteria.`);
                authorIsAllowed = false;
              }
            } catch (error) {
              core.info(`Unable to extract git user metadata references: ${error.message}`);
            }
          }

          // 5. Establish Ultimate Trigger Condition Output
          if (authorIsAllowed && filteredFilesList.length > 0) {
            triggerUpdate = true;
          }

          core.setOutput('changed_files', changedFilesList.join(' '));
          core.setOutput('changed_files_filtered', triggerUpdate ? filteredFilesList.join(' ') : '');
          core.setOutput('trigger_update', String(triggerUpdate));
