name: Get Authorization Token
description: 'Reusable action to get an authorization token either from a GitHub App or a user (or personal) access token.'

inputs:
  show-summary:
    description: 'Whether to include a summary of changed files in the GitHub Actions summary.'
    default: 'false'
  paths:
    description: 'The paths to check for changes. If any of these paths have changed, the action will output a list of changed files.'
    # default: |
    #   package.json
    #   package-lock.json
  ignore-authors:
    description: 'A newline delimited list of commit authors to ignore when checking for changes (e.g. semantic-release-bot and github-actions[bot]).'
    # default: |
    #   github-actions[bot]
    #   semantic-release-bot
  ignore-events:
    description: 'A newline delimited list of GitHub event names to ignore when checking for changes (e.g. push, pull_request, workflow_dispatch).'
outputs:
  result:
    description: 'The overall result of the changed files check.'
    value: ${{ steps.changed-files.outputs.result }}
  changed-files:
    description: 'A newline delimited list of changed files.'
    value: ${{ steps.changed-files.outputs.changed-files }}
  changed-files-filtered:
    description: 'A newline delimited list of changed files that match the specified paths and are not authored by ignored authors.'
    value: ${{ steps.changed-files.outputs.changed-files-filtered }}

runs:
  using: 'composite'
  steps:
    - name: Determine Changed Files
      id: changed-files
      uses: actions/github-script@v9
      env:
        SPECIFIED_PATHS: ${{ inputs.paths }}
        IGNORE_AUTHORS: ${{ inputs.ignore-authors }}
        IGNORE_EVENTS: ${{ inputs.ignore-events }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # Input environment variable for show-summary so getBooleanInput works in a composite action
        INPUT_SHOW-SUMMARY: ${{ inputs.show-summary }}
      with:
        script: |
          // Import the execSync function from the child_process module for executing Git commands
          const { execSync } = require('child_process')

          // Reusable input tokenizer to safely split environment variables by commas, spaces, or lines
          const parseInput = (envVar) =>
            (process.env[envVar] || '')
              .split(/[\r\n\s,]+/)
              .map((p) => p.trim())
              .filter(Boolean)

          // Custom glob-to-regex matcher to eliminate all external npm dependencies
          const matchGlob = (file, pattern) => {
            const regexStr =
              '^' +
              pattern
                .replace(/[.+^\${}()|[\]\\]/g, '\\$&') // 1. Escape regular regex characters safely
                .replace(/\*\*/g, '.*') // 2. Turn ** straight into a recursive wildcard (.*)
                .replace(/(?<!\.)\*/g, '[^/]*') + // 3. Turn single * into folder-only matches
              '\$'
            return new RegExp(regexStr).test(file)
          }

          // 1. Evaluate Ignore Events Condition
          const ignoreEvents = parseInput('IGNORE_EVENTS')
          const eventIsIgnored = ignoreEvents.includes(context.eventName)

          if (eventIsIgnored) {
            core.info(`Event '${context.eventName}' matches ignore configuration. Skipping processing.`)
            core.setOutput('changed-files', '')
            core.setOutput('changed-files-filtered', '')
            return false
          }

          // 2. Determine Changed Files Safely with Shallow Clone Fallbacks
          let diffOutput = ''
          const isTag = process.env.GITHUB_REF && process.env.GITHUB_REF.startsWith('refs/tags/')
          const refBefore = context.payload.before
          const nullSha = '0000000000000000000000000000000000000000'

          // Determine strategy arguments upfront
          let gitDiffArgs = ['diff', '--name-only', refBefore, context.payload.after]
          if (isTag) {
            core.info('Tag push event identified. Parsing target commit structural changes.')
            gitDiffArgs = ['diff-tree', '--no-commit-id', '--name-only', '-r', 'HEAD']
          } else if (!refBefore || refBefore === nullSha) {
            core.info('New branch tree push identified. Dynamically evaluating fork boundary points.')
            const defaultBranch = process.env.DEFAULT_BRANCH || 'main'
            try {
              const baseCommit = execSync(`git merge-base origin/${defaultBranch} HEAD`, { encoding: 'utf8' }).trim()
              gitDiffArgs = ['diff', '--name-only', baseCommit, 'HEAD']
            } catch {
              gitDiffArgs = null // Force fallback to git show if merge-base fails
            }
          }

          // Execute diff strategy, with a unified fallback to git show for shallow clones
          try {
            if (!gitDiffArgs) throw new Error('Forcing fallback execution strategy.')
            diffOutput = execSync(`git ${gitDiffArgs.join(' ')}`, { encoding: 'utf8' })
          } catch (err) {
            core.info(
              `Primary Git tracking strategy failed or history is shallow. Falling back to git show. Details: ${err.message}`
            )
            try {
              diffOutput = execSync('git show --name-only --pretty="" HEAD', { encoding: 'utf8' })
            } catch (fallbackErr) {
              core.info(`Fallback git show strategy failed completely: ${fallbackErr.message}`)
            }
          }

          const changedFilesList = diffOutput
            .split('\n')
            .map((f) => f.trim())
            .filter(Boolean)

          core.info(`Detected Changed Files: ${changedFilesList.join(', ')}`)

          // 3. Process Glob Path Matches
          let filteredFilesList = []
          const inputPaths = parseInput('SPECIFIED_PATHS')
          core.info(`Specified Path Patterns: ${inputPaths.join(', ')}`)

          if (inputPaths.length > 0 && changedFilesList.length > 0) {
            filteredFilesList = changedFilesList.filter((file) => inputPaths.some((pattern) => matchGlob(file, pattern)))
            core.info(`Files Matching Path Patterns: ${filteredFilesList.join(', ')}`)
          } else {
            core.info('No explicit path patterns provided or changed file list is empty.')
          }

          // 4. Validate Commit Author Authority
          let authorIsAllowed = true
          const ignoreAuthors = parseInput('IGNORE_AUTHORS')

          if (ignoreAuthors.length > 0) {
            try {
              const commitAuthor = execSync("git log -1 --pretty=format:'%an'", { encoding: 'utf8' }).trim()
              core.info(`Commit authored by: '${commitAuthor}'`)
              if (ignoreAuthors.includes(commitAuthor)) {
                core.info(`Commit author '${commitAuthor}' matches ignore criteria.`)
                authorIsAllowed = false
              }
            } catch (error) {
              core.info(`Unable to extract git user metadata references: ${error.message}`)
            }
          }

          // 5. Establish Ultimate Trigger Condition Output
          const result = authorIsAllowed && filteredFilesList.length > 0

          const showSummary = core.getBooleanInput('show-summary')

          if (showSummary) {
            core.summary.addRaw(`<table>
              <tr><th>Specified Path Patterns</th><td>${inputPaths.join(', ')}</td></tr>
              <tr><th>Changed Files</th><td>${changedFilesList.join(', ')}</td></tr>
              <tr><th>Filtered Files</th><td>${filteredFilesList.join(', ')}</td></tr>
              <tr><th>Ignore Authors</th><td>${ignoreAuthors.join(', ')}</td></tr>
              <tr><th>Author Is Allowed</th><td>${authorIsAllowed}</td></tr>
              <tr><th>Ignore Events</th><td>${ignoreEvents.join(', ')}</td></tr>
              <tr><th>Event Is Allowed</th><td>${eventIsIgnored}</td></tr>
              <tr><th>Result</th><td>${result}</td></tr>
              </table>`)

            await core.summary.write()
          }

          core.setOutput('changed-files', changedFilesList.join(' '))
          core.setOutput('changed-files-filtered', result ? filteredFilesList.join(' ') : '')

          return result

    - name: Show Outputs
      shell: bash
      if: runner.debug == '1'
      env:
        OUTPUT_JSON: ${{ toJson(steps.changed-files.outputs) }}
        RESULT: ${{ steps.changed-files.outputs.result }}
      run: |
        echo "Result: $RESULT"
        echo "Output JSON:"
        echo "$OUTPUT_JSON"
