name: Fetch Archived Action
description: This action fetches archived repositories with open issues.
inputs:
  org:
    description: 'The organization to fetch.'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for authentication.'
    required: true
outputs:
  repos:
    description: 'The list of repositories with open issues.'
    value: ${{ steps.fetch-archived.outputs.repos }}
  count:
    description: 'The count of repositories with open issues.'
    value: ${{ steps.fetch-archived.outputs.count }}
branding:
  color: white
  icon: archive

runs:
  using: 'composite'
  steps:
    - name: Fetch Archived Repositories
      id: fetch-archived
      uses: actions/github-script@v9
      env:
        ORG: ${{ inputs.org }}
      with:
        # Use a PAT if you need to fetch private repositories across the whole organization
        github-token: ${{ inputs.github-token }}
        script: |
          // Safely grab the current organization name from the runner context
          const orgName = process.env.ORG || context.repo.owner;

          const repos = [];

          try {
            // Use the iterator. This bypasses Octokit's broken pagination wrapper
            // and gives us direct access to the raw HTTP responses.
            const iterator = github.paginate.iterator(
              github.rest.apps.listReposAccessibleToInstallation,
              { per_page: 100 }
            );

            for await (const response of iterator) {
              // Under a GitHub App token, the API encapsulates the array strictly inside response.data.repositories
              const pageRepos = response.data.repositories || [];

              // Filter down to the exact organization and ensure they are archived
              const matches = pageRepos
                .filter(repo => {
                  const isTargetOrg = repo.owner.login.toLowerCase() === orgName.toLowerCase();
                  return isTargetOrg && repo.archived;
                })
                .map(repo => ({
                  name: repo.name,
                  owner: repo.owner.login,
                  org: orgName,
                  full_name: repo.full_name,
                  html_url: repo.html_url,
                  private: repo.private // Adding this so you can verify it captures private repos
                }));

              repos.push(...matches);
            }

            console.log(`Execution complete. Found ${repos.length} total archived repositories.`);
            console.log(JSON.stringify(repos, null, 2));

          } catch (error) {
            console.error("API Execution Failed:", error.message);
          }

          core.info(`Successfully fetched ${repos.length} repositories.`);
          core.info(`Repositories: ${JSON.stringify(repos, null, 2)}`);
          core.info(`List: ${JSON.stringify(repos.map(repo => repo.full_name))}`);

          // Serialize the array to a JSON string and set the output
          core.setOutput('repos', JSON.stringify(repos));
          core.setOutput('count', repos.length);
