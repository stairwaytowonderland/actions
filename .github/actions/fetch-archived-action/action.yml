name: Fetch Archived Action
description: This action fetches archived repositories with open issues.
inputs:
  org:
    description: 'The organization to fetch.'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for authentication.'
    required: true
outputs:
  repos:
    description: 'The list of repositories with open issues.'
    value: ${{ steps.fetch-archived.outputs.repos }}
  count:
    description: 'The count of repositories with open issues.'
    value: ${{ steps.fetch-archived.outputs.count }}
branding:
  color: white
  icon: archive

runs:
  using: 'composite'
  steps:
    - name: Fetch Archived Repositories
      id: fetch-archived
      uses: actions/github-script@v9
      env:
        ORG: ${{ inputs.org }}
      with:
        # Use a PAT if you need to fetch private repositories across the whole organization
        github-token: ${{ inputs.github-token }}
        script: |
          // Safely grab the current organization name from the runner context
          const orgName = process.env.ORG || context.repo.owner;

          const repos = [];

          // Streams pages explicitly without guessing Octokit's unwrapping behavior
          for await (const response of github.paginate.iterator(github.rest.apps.listReposAccessibleToInstallation, { per_page: 100 })) {
            // At the iterator level, GitHub wraps the array strictly inside .data.repositories
            const pageRepos = response.data.repositories || [];

            const filteredPage = pageRepos
              .filter(repo => repo.archived)
              .map(repo => ({
                name: repo.name,
                owner: repo.owner.login,
                org: orgName,
                full_name: repo.full_name,
                html_url: repo.html_url
              }));

            repos.push(...filteredPage);
          }

          core.info(`Successfully fetched ${repos.length} repositories.`);
          core.info(`Repositories: ${JSON.stringify(repos, null, 2)}`);
          core.info(`List: ${JSON.stringify(repos.map(repo => repo.full_name))}`);

          // Serialize the array to a JSON string and set the output
          core.setOutput('repos', JSON.stringify(repos));
          core.setOutput('count', repos.length);
